<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spark — SaaS Idea Generator</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ── Page-specific styles ── */
.hero {
  padding: 4rem 2.5rem 3rem;
  text-align: center;
  position: relative;
}

.hero h1 {
  font-size: clamp(2.8rem, 6vw, 4.5rem);
  font-weight: 800;
  line-height: 1.0;
  margin: 1.2rem 0 1rem;
  color: var(--text);
}

.hero h1 em {
  font-style: normal;
  background: linear-gradient(135deg, #a99aff 0%, #5b4cff 40%, #f0a500 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-sub {
  font-size: 0.9rem;
  color: var(--text-2);
  max-width: 460px;
  margin: 0 auto 2rem;
  line-height: 1.7;
}

.stats-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2.5rem;
  margin-bottom: 3rem;
  flex-wrap: wrap;
}

.stat { text-align: center; }
.stat-val {
  font-family: 'Syne', sans-serif;
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.04em;
}
.stat-label {
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-top: 2px;
}
.stat-divider { width: 1px; height: 32px; background: var(--border); }

/* Controls panel */
.controls-panel {
  max-width: 800px;
  margin: 0 auto 3rem;
  padding: 0 2.5rem;
}

.controls-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
}

.filter-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr auto;
  gap: 1rem;
  align-items: end;
}

.filter-group { display: flex; flex-direction: column; }

.gen-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  padding: 0.6rem 1.5rem;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.18s;
  height: 38px;
}

.gen-btn:hover:not(:disabled) {
  background: #6d5fff;
  box-shadow: 0 6px 24px rgba(91,76,255,0.35);
  transform: translateY(-1px);
}
.gen-btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* Count selector */
.count-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-top: 1rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}

.count-row label { margin: 0; }

.count-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-2);
  border-radius: 5px;
  padding: 0.25rem 0.6rem;
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  cursor: pointer;
  transition: all 0.15s;
}
.count-btn.active, .count-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-lo);
}

.count-spacer { flex: 1; }

/* Sort */
.sort-row {
  max-width: 800px;
  margin: 0 auto 1.25rem;
  padding: 0 2.5rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
}
.sort-label { font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); }

.sort-chip {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-3);
  border-radius: 20px;
  padding: 0.2rem 0.65rem;
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
}
.sort-chip:hover { border-color: var(--border-hi); color: var(--text-2); }
.sort-chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-lo); }

/* Ideas container */
.ideas-section {
  max-width: 800px;
  margin: 0 auto;
  padding: 0 2.5rem 4rem;
}

/* Idea card */
.idea-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.75rem;
  margin-bottom: 1rem;
  opacity: 0;
  transform: translateY(18px);
  animation: fadeUp 0.45s ease both;
  transition: border-color 0.2s, box-shadow 0.2s;
  position: relative;
  overflow: hidden;
}

.idea-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), transparent);
  opacity: 0;
  transition: opacity 0.2s;
}

.idea-card:hover { border-color: rgba(91,76,255,0.35); }
.idea-card:hover::before { opacity: 1; }

.idea-top {
  display: flex;
  gap: 1rem;
  align-items: flex-start;
  margin-bottom: 1rem;
}

.idea-num {
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-3);
  white-space: nowrap;
  padding-top: 4px;
  min-width: 3rem;
  flex-shrink: 0;
}

.idea-main { flex: 1; min-width: 0; }

.idea-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
  margin-bottom: 0.2rem;
}

.idea-tagline {
  font-size: 0.78rem;
  color: var(--text-2);
  font-style: italic;
  font-family: 'Fraunces', serif;
  margin-bottom: 0.6rem;
}

.idea-tags { display: flex; gap: 0.35rem; flex-wrap: wrap; }

.idea-actions {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  flex-shrink: 0;
}

.idea-desc {
  font-size: 0.8rem;
  color: var(--text-2);
  line-height: 1.7;
  margin-bottom: 1.25rem;
}

.idea-metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.75rem;
  padding: 1rem;
  background: rgba(0,0,0,0.2);
  border-radius: 8px;
  margin-bottom: 1rem;
}

.metric { display: flex; flex-direction: column; gap: 0.2rem; }
.metric-label { font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); }
.metric-val { font-size: 0.82rem; font-weight: 400; color: var(--text); font-family: 'DM Mono', monospace; }

.pain-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1rem;
}

.pain-label-txt { font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); white-space: nowrap; }
.pain-bar { flex: 1; }

.idea-footer {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}

.competitors-txt { font-size: 0.65rem; color: var(--text-3); }
.competitors-txt strong { color: var(--text-2); }

.expand-btn {
  margin-left: auto;
  background: none;
  border: 1px solid var(--border);
  color: var(--text-3);
  border-radius: 5px;
  padding: 0.25rem 0.65rem;
  font-size: 0.65rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  font-family: 'DM Mono', monospace;
  transition: all 0.15s;
}
.expand-btn:hover { border-color: var(--border-hi); color: var(--text-2); }

.idea-detail {
  display: none;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
  margin-top: 1rem;
}

.idea-detail.open { display: block; }

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.detail-block label { margin-bottom: 0.4rem; }
.tech-list {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
}

.validate-link {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.65rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--amber);
  text-decoration: none;
  margin-top: 0.75rem;
  border: 1px solid rgba(240,165,0,0.25);
  padding: 0.3rem 0.7rem;
  border-radius: 5px;
  transition: all 0.15s;
}
.validate-link:hover { background: var(--amber-lo); }

/* Loading animation */
.loading-wave {
  display: flex;
  gap: 4px;
  align-items: center;
}
.loading-wave span {
  display: block;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
  animation: wave 0.9s ease-in-out infinite;
}
.loading-wave span:nth-child(2) { animation-delay: 0.15s; }
.loading-wave span:nth-child(3) { animation-delay: 0.3s; }

@keyframes wave {
  0%, 100% { transform: scaleY(1); opacity: 0.4; }
  50% { transform: scaleY(1.7); opacity: 1; }
}

/* Responsive */
@media (max-width: 680px) {
  .filter-grid { grid-template-columns: 1fr 1fr; }
  .gen-btn { grid-column: 1 / -1; }
  .idea-metrics { grid-template-columns: 1fr 1fr; }
  .detail-grid { grid-template-columns: 1fr; }
  .idea-top { flex-direction: column; gap: 0.75rem; }
  .idea-actions { flex-direction: row; }
}
</style>
</head>
<body>

<!-- Background -->
<div class="bg-grid"></div>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<div class="app-wrapper">
  <!-- Nav -->
  <nav>
    <a href="index.html" class="nav-brand">
      <div class="brand-icon">⚡</div>
      <span class="brand-name">Spark</span>
    </a>
    <div class="nav-links">
      <a href="index.html" class="nav-link active">
        <span>Generate</span>
      </a>
      <a href="saved.html" class="nav-link">
        <span>Saved</span>
        <span class="nav-badge" id="saved-badge" style="display:none">0</span>
      </a>
      <a href="validate.html" class="nav-link">
        <span>Validate</span>
      </a>
    </div>
  </nav>

  <!-- Hero -->
  <div class="hero">
    <p class="eyebrow">SaaS Idea Generator</p>
    <h1>Build your next<br><em>big thing</em></h1>
    <p class="hero-sub">Curated SaaS opportunities with real market data, filtered to match your skills, market, and resources.</p>

    <div class="stats-row">
      <div class="stat">
        <div class="stat-val">20</div>
        <div class="stat-label">Vetted Ideas</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <div class="stat-val">$300K+</div>
        <div class="stat-label">Min. ARR Potential</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <div class="stat-val">3 wks</div>
        <div class="stat-label">Fastest MVP</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <div class="stat-val">8</div>
        <div class="stat-label">Markets Covered</div>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-panel">
    <div class="controls-card">
      <div class="filter-grid">
        <div class="filter-group">
          <label>Target Market</label>
          <div class="select-wrap">
            <select id="f-market">
              <option value="any">Any market</option>
              <option value="smb">Small Business</option>
              <option value="enterprise">Enterprise</option>
              <option value="consumer">Consumer / B2C</option>
              <option value="developer">Developers</option>
              <option value="creators">Creators & Freelancers</option>
              <option value="healthcare">Healthcare</option>
              <option value="finance">Finance</option>
              <option value="ecommerce">E-commerce</option>
            </select>
          </div>
        </div>
        <div class="filter-group">
          <label>Revenue Model</label>
          <div class="select-wrap">
            <select id="f-model">
              <option value="any">Any model</option>
              <option value="subscription">Subscription</option>
              <option value="usage">Usage-based</option>
              <option value="freemium">Freemium</option>
              <option value="api">API / Pay-per-call</option>
              <option value="lifetime">Lifetime deal</option>
            </select>
          </div>
        </div>
        <div class="filter-group">
          <label>Difficulty</label>
          <div class="select-wrap">
            <select id="f-diff">
              <option value="any">Any difficulty</option>
              <option value="easy">Easy — Solo build</option>
              <option value="medium">Medium — Small team</option>
              <option value="hard">Hard — Funded startup</option>
            </select>
          </div>
        </div>
        <button class="gen-btn" id="gen-btn" onclick="generate()">
          <span id="btn-label">⚡ Generate</span>
        </button>
      </div>

      <!-- Count & options row -->
      <div class="count-row">
        <label style="white-space:nowrap;">Show:</label>
        <button class="count-btn" onclick="setCount(3)" data-count="3">3</button>
        <button class="count-btn active" onclick="setCount(5)" data-count="5">5</button>
        <button class="count-btn" onclick="setCount(8)" data-count="8">8</button>
        <button class="count-btn" onclick="setCount(0)" data-count="0">All</button>
        <div class="count-spacer"></div>
        <span id="result-count" style="font-size:0.65rem;color:var(--text-3);letter-spacing:0.06em;"></span>
      </div>
    </div>
  </div>

  <!-- Sort row -->
  <div class="sort-row" id="sort-row" style="display:none;">
    <span class="sort-label">Sort by:</span>
    <button class="sort-chip active" onclick="setSort('pain')" data-sort="pain">Pain Score</button>
    <button class="sort-chip" onclick="setSort('revenue')" data-sort="revenue">Revenue Potential</button>
    <button class="sort-chip" onclick="setSort('mvp')" data-sort="mvp">Time to MVP</button>
    <button class="sort-chip" onclick="setSort('random')" data-sort="random">Shuffle</button>
  </div>

  <!-- Ideas -->
  <div class="ideas-section" id="ideas-section"></div>
</div>

<script src="app.js"></script>
<script>
let currentIdeas = [];
let showCount = 5;
let currentSort = 'pain';

function setCount(n) {
  showCount = n;
  document.querySelectorAll('.count-btn').forEach(b => {
    b.classList.toggle('active', +b.dataset.count === n);
  });
  if (currentIdeas.length) renderIdeas(sortIdeas(currentIdeas));
}

function setSort(s) {
  currentSort = s;
  document.querySelectorAll('.sort-chip').forEach(b => {
    b.classList.toggle('active', b.dataset.sort === s);
  });
  if (currentIdeas.length) renderIdeas(sortIdeas(currentIdeas));
}

function sortIdeas(ideas) {
  const sorted = [...ideas];
  if (currentSort === 'pain') sorted.sort((a,b) => b.painScore - a.painScore);
  else if (currentSort === 'revenue') sorted.sort((a,b) => parseInt(b.arr) - parseInt(a.arr));
  else if (currentSort === 'mvp') sorted.sort((a,b) => a.mvpWeeks[0] - b.mvpWeeks[0]);
  else shuffle(sorted);
  return showCount ? sorted.slice(0, showCount) : sorted;
}

function generate() {
  const market = document.getElementById('f-market').value;
  const model  = document.getElementById('f-model').value;
  const diff   = document.getElementById('f-diff').value;

  const filtered = IDEAS.filter(idea => {
    const mOk  = market === 'any' || idea.market.includes(market);
    const modOk = model === 'any' || idea.models.includes(model);
    const dOk  = diff === 'any' || idea.difficulty === diff;
    return mOk && modOk && dOk;
  });

  const shuffled = shuffle(filtered);
  currentIdeas = shuffled;

  // Button loading state
  const btn = document.getElementById('gen-btn');
  const lbl = document.getElementById('btn-label');
  btn.disabled = true;
  lbl.innerHTML = '<div class="loading-wave"><span></span><span></span><span></span></div>';

  setTimeout(() => {
    btn.disabled = false;
    lbl.textContent = '⚡ Generate';
    const toShow = sortIdeas(shuffled);
    const total = document.getElementById('result-count');
    total.textContent = `${toShow.length} of ${filtered.length} matching ideas`;
    document.getElementById('sort-row').style.display = 'flex';
    renderIdeas(toShow);
  }, 800);
}

function renderIdeas(ideas) {
  const section = document.getElementById('ideas-section');
  if (!ideas.length) {
    section.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔭</div>
        <h3>No matches found</h3>
        <p>Try loosening your filters — some great ideas span multiple categories.</p>
      </div>`;
    return;
  }
  section.innerHTML = ideas.map((idea, i) => cardHTML(idea, i)).join('');
}

function cardHTML(idea, i) {
  const diff = getDiffTag(idea.difficulty);
  const pain = getPainLabel(idea.painScore);
  const saved = Saved.isSaved(idea.id);

  return `
  <div class="idea-card" id="card-${idea.id}" style="animation-delay:${i * 0.07}s">
    <div class="idea-top">
      <div class="idea-num">№ ${String(i+1).padStart(2,'0')}</div>
      <div class="idea-main">
        <div class="idea-title">${idea.title}</div>
        <div class="idea-tagline">"${idea.tagline}"</div>
        <div class="idea-tags">
          <span class="tag ${diff.cls}">${diff.label}</span>
          <span class="tag ${pain.cls}">${pain.label}</span>
          ${idea.tags.slice(0,2).map(t => `<span class="tag tag-gray">${t}</span>`).join('')}
        </div>
      </div>
      <div class="idea-actions">
        <button class="btn btn-ghost btn-sm btn-icon" title="${saved ? 'Saved' : 'Save idea'}" id="save-btn-${idea.id}"
          onclick="toggleSave('${idea.id}')" style="${saved ? 'border-color:var(--green);color:var(--green)' : ''}">
          ${saved ? '♥' : '♡'}
        </button>
        <button class="btn btn-ghost btn-sm btn-icon" title="Validate this idea"
          onclick="location.href='validate.html?id=${idea.id}'" style="font-size:0.75rem">→</button>
      </div>
    </div>

    <p class="idea-desc">${idea.desc}</p>

    <div class="idea-metrics">
      <div class="metric">
        <span class="metric-label">Revenue Est.</span>
        <span class="metric-val">${idea.revenueRange}</span>
      </div>
      <div class="metric">
        <span class="metric-label">ARR Potential</span>
        <span class="metric-val">${idea.arr}</span>
      </div>
      <div class="metric">
        <span class="metric-label">Time to MVP</span>
        <span class="metric-val">${idea.mvpWeeks[0]}–${idea.mvpWeeks[1]} wks</span>
      </div>
      <div class="metric">
        <span class="metric-label">Market Size</span>
        <span class="metric-val">${idea.marketSize}</span>
      </div>
    </div>

    <div class="pain-row">
      <span class="pain-label-txt">Pain Score</span>
      <div class="pain-bar">
        <div class="meter-track">
          <div class="meter-fill ${idea.painScore >= 90 ? 'meter-red' : idea.painScore >= 80 ? 'meter-amber' : 'meter-accent'}"
               style="width:${idea.painScore}%"></div>
        </div>
      </div>
      <span style="font-size:0.7rem;color:var(--text-2);min-width:2rem;text-align:right;">${idea.painScore}</span>
    </div>

    <div class="idea-footer">
      <span class="competitors-txt">vs. <strong>${idea.competitors.join(', ')}</strong></span>
      <button class="expand-btn" onclick="toggleDetail('${idea.id}', this)">+ Details</button>
    </div>

    <div class="idea-detail" id="detail-${idea.id}">
      <div class="detail-grid">
        <div class="detail-block">
          <label>Competitive Edge</label>
          <p style="font-size:0.78rem;color:var(--text-2);line-height:1.6">${idea.edge}</p>
        </div>
        <div class="detail-block">
          <label>Tech Stack</label>
          <div class="tech-list">
            ${idea.techStack.map(t => `<span class="tag tag-purple">${t}</span>`).join('')}
          </div>
          <a href="validate.html?id=${idea.id}" class="validate-link">
            Run full validation →
          </a>
        </div>
      </div>
    </div>
  </div>`;
}

function toggleDetail(id, btn) {
  const detail = document.getElementById('detail-' + id);
  const open = detail.classList.toggle('open');
  btn.textContent = open ? '− Details' : '+ Details';
}

function toggleSave(id) {
  const idea = getIdea(id);
  if (!idea) return;
  const btn = document.getElementById('save-btn-' + id);
  if (Saved.isSaved(id)) {
    Saved.remove(id);
    btn.textContent = '♡';
    btn.style.cssText = '';
    showToast('Removed from saved ideas', '✕');
  } else {
    Saved.save(idea);
    btn.textContent = '♥';
    btn.style.cssText = 'border-color:var(--green);color:var(--green)';
    showToast('Saved! View in Saved Ideas →', '♥');
  }
}

// Auto-generate on load
window.addEventListener('DOMContentLoaded', () => {
  generate();
});
</script>
</body>
</html>
